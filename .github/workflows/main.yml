name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - "src/JsonHero.Api/**"
      - "src/JsonHero.Api.Tests/**"
      - "src/JsonHero.Web/**"
      - "Dockerfile"
      - "solution.slnx"
      - "NuGet.config"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: dotnet test src/JsonHero.Api.Tests/JsonHero.Api.Tests.csproj
      - working-directory: src/JsonHero.Web
        run: npm ci
      - working-directory: src/JsonHero.Web
        run: npm test
      - working-directory: src/JsonHero.Web
        run: npm run build
